name: Keep Render free-tier service awake

on:
  schedule:
    # Every 10 minutes — comfortably under Render's 15-minute idle-sleep
    # threshold. Does nothing for the separate "wiped on redeploy/restart"
    # free-tier limitation; see render.yaml for why.
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # lets you trigger a manual ping from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the deployed service
        run: curl -fsS "${{ vars.RENDER_SERVICE_URL }}" || true
